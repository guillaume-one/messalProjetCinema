<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Films</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

<header class="banniere-bg">
    <img src="{{ url_for('static', filename='Ressources/Images/banner.png') }}" alt="Bannière cinéma du Castor" class="img-fluid">
</header>

<nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <!-- Bouton hamburger (visible uniquement sur petit écran) -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>

    <!-- Partie repliable : contient les liens -->
    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item dropdown">
                <a class="nav-link" href="/" role="button">Accueil</a>
            </li>
            <li class="nav-item dropdown">
                 <a class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown">Films</a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/films">Tous les films</a></li>
                    <div class="dropdown-divider"></div>
                    {% for film in films %}
                        <li><a class="dropdown-item" href="/film/{{ film.id }}">{{ film.titre }}</a></li>
                    {% endfor %}
                </ul>
            </li>
            <li class="nav-item dropdown">
                <a class="nav-link" href="/seances" role="button">Séances</a>
            </li>
        </ul>
    </div>
</nav>

<div id="main" class="container-fluid">
    <div class="container">
        <div class="row">
            {% for film in films %}
                <div class="col-4">
                    <a href="/film/{{ film.id }}">
                        <img src="{{ url_for('static', filename="Ressources/Images/" ~ film.affiche) }}">
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>

    <br><br>

    <a href="/" class="btn btn-primary">Revenir à l'accueil</a>
</div>

<br><br>

<footer class="pied mt-auto">
    BTS CIEL 2 | Lycée Simone de Beauvoir | Guillaume MESSAL &copy; 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>

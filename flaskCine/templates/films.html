{% extends "base.html" %}
{% block titre %}
    Films
{% endblock %}

{% block contenu %}
    <div id="main" class="container-fluid">
        <div class="container">
            <div class="row">
                {% for film in films %}
                    <div class="col-4">
                        <a href="/film/{{ film.id }}">
                            <img src="{{ url_for('static', filename="Ressources/Images/" ~ film.affiche) }}">
                        </a>
                    </div>
                {% endfor %}
            </div>
        </div>

        <br><br>

        <a href="/" class="btn btn-primary">Revenir à l'accueil</a>
    </div>
{% endblock %}
